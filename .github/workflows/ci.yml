name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm exec tsc --noEmit
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  # Browser smoke test. Runs only when the repository has the test-account secrets,
  # and never writes to the database (the test blocks every non-GET Supabase request).
  e2e:
    runs-on: ubuntu-latest
    needs: check
    if: ${{ vars.E2E_ENABLED == 'true' }}
    defaults:
      run:
        working-directory: frontend
    env:
      PALVIN_E2E_USER: ${{ secrets.PALVIN_E2E_USER }}
      PALVIN_E2E_PASS: ${{ secrets.PALVIN_E2E_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
